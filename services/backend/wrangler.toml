name = "odyssey-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[env.development]
vars = { ENVIRONMENT = "development" }

# For production, add your Hyperdrive binding:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

# For local dev with wrangler, set DATABASE_URL in .dev.vars:
# DATABASE_URL = "postgresql://postgres:password@localhost:5432/odyssey_restaurant"
